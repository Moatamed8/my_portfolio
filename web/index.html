<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Primary Meta Tags -->
  <title>Moatamed Wageh — Mobile Application Developer</title>
  <meta name="title" content="Moatamed Wageh — Mobile Application Developer">
  <meta name="description" content="Moatamed Wageh is a Mobile Application Developer with 3+ years building high-quality Flutter apps for iOS, Android & Web. Explore my work and let's build something great.">
  <meta name="author" content="Moatamed Wageh">
  <meta name="keywords" content="Moatamed Wageh, Flutter Developer, Mobile App Developer, iOS, Android, Software Engineer, Portfolio">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Moatamed Wageh — Mobile Application Developer">
  <meta property="og:description" content="3+ years building high-quality Flutter apps for iOS, Android & Web. Explore my work.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Theme color adapts to system preference -->
  <meta name="theme-color" content="#0C0B0A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moatamed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #0C0B0A;
      --fg: #F5F9FF;
      --muted: #D3DDE8;
      --accent: #7DE7EB;
      --accent2: #33BBCF;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .6s ease, visibility .6s ease;
      will-change: opacity;
    }
    #loading.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
    }
    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 1s linear infinite;
    }
    .loader-ring.inner {
      inset: 14px;
      border-top-color: var(--accent2);
      border-right-color: transparent;
      border-left-color: var(--accent);
      animation-duration: 1.5s;
      animation-direction: reverse;
    }
    .loader-mono {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .loader-name {
      color: var(--fg);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .5px;
      margin: 0;
    }
    .loader-sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      margin: 8px 0 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .loader-bar {
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: rgba(138,147,166,0.18);
      overflow: hidden;
    }
    .loader-bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-ring, .loader-bar > span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-logo">
      <div class="loader-ring"></div>
      <div class="loader-ring inner"></div>
      <span class="loader-mono">MW</span>
    </div>
    <p class="loader-name">Moatamed Wageh</p>
    <p class="loader-sub">Loading My experience</p>
    <div class="loader-bar"><span></span></div>
  </div>


  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
